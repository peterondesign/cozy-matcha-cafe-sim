<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 145">
<defs><linearGradient id="glaze" x2=".9" y2=".3"><stop stop-color="#473e37"/><stop offset=".27" stop-color="#8e7865"/><stop offset=".55" stop-color="#685449"/><stop offset=".9" stop-color="#493f37"/><stop offset="1" stop-color="#776351"/></linearGradient><radialGradient id="matcha"><stop stop-color="#ced581"/><stop offset=".8" stop-color="#a2b551"/><stop offset="1" stop-color="#768e38"/></radialGradient><pattern id="grain" width="9" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#f3d7ad" opacity=".7"/><circle cx="7" cy="6" r=".5" fill="#3a3126" opacity=".45"/><circle cx="4" cy="7" r=".35" fill="#fff6e4"/></pattern>
<filter id="clay"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" result="n"/><feColorMatrix type="matrix" values="0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .22  0 0 0 .18 0" in="n"/></filter></defs>
<style>.tea,.powder,.steam,.tool{display:none}#warm:target~.steam,#finish:target~.steam,#water:target~.steam,#sift:target~.powder,#water:target~.tea,#whisk:target~.tea,#foam:target~.tea,#finish:target~.tea,#whisk:target~.tool{display:inline}@media(prefers-reduced-motion:no-preference){.steam{animation:drift 2s ease-in-out infinite alternate}.tool{transform-origin:96px 67px;animation:stir .22s ease-in-out alternate infinite}}@keyframes drift{to{transform:translate(3px,-5px);opacity:.35}}@keyframes stir{to{transform:rotate(9deg)}}</style>
