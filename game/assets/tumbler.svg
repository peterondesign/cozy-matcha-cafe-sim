<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 186">
<defs>
 <linearGradient id="wall"><stop stop-color="#e4f3e1" stop-opacity=".65"/><stop offset=".12" stop-color="#fff" stop-opacity=".17"/><stop offset=".65" stop-color="#c1d5bb" stop-opacity=".08"/><stop offset=".91" stop-color="#fff" stop-opacity=".44"/><stop offset="1" stop-color="#566c5d" stop-opacity=".48"/></linearGradient>
 <linearGradient id="cream"><stop stop-color="#cfb98d"/><stop offset=".3" stop-color="#fff3d7"/><stop offset=".76" stop-color="#f6e4bc"/><stop offset="1" stop-color="#d3c39c"/></linearGradient>
 <linearGradient id="tea" x2=".15" y2="1"><stop stop-color="#536b26"/><stop offset=".45" stop-color="#849c37"/><stop offset="1" stop-color="#c6cf78"/></linearGradient>
 <clipPath id="inside"><path d="M14 21 Q58 34 106 21 L96 163 Q60 178 24 163Z"/></clipPath>
 <g id="cube" stroke="#7e9988" stroke-width="1.1" stroke-linejoin="round"><path fill="#ecf8e7" fill-opacity=".76" d="m0 4 15-5 10 7-3 16-15 4-9-9Z"/><path fill="#bfd9cc" fill-opacity=".68" d="m7 11 18-5-3 16-15 4Z"/><path fill="none" stroke="#fffdf1" d="m1 4 7 6 13-4M1 8l-1 7"/></g>
</defs>
<style>
.state,.dairy,.green,.cubes,.stream{display:none}
#ice:target~.body .cubes,#milk:target~.body .cubes,#latte:target~.body .cubes,#milk:target~.body .dairy,#latte:target~.body .dairy,#latte:target~.body .green{display:inline}
#milk:target~.body .stream,#latte:target~.body .stream{display:inline;animation:pour .85s both}
#latte:target~.body .stream{stroke:#829935}
@media(prefers-reduced-motion:no-preference){#ice:target~.body .cube{animation:drop .6s both}#ice:target~.body .second{animation-delay:.12s}#milk:target~.body .dairy,#latte:target~.body .green{animation:rise .9s ease-out both;transform-box:fill-box;transform-origin:center bottom}}
@keyframes drop{from{transform:translateY(-64px)}75%{transform:translateY(3px)}}@keyframes rise{from{transform:scaleY(.03)}}@keyframes pour{0%,100%{opacity:0}15%,80%{opacity:.95}}
#milk:target~.body .cubes,#latte:target~.body .cubes{transform:translateY(-54px)}
</style>
<g id="glass"/><g id="ice"/><g id="milk"/><g id="latte"/>
<g class="body">
<path fill="url(#wall)" stroke="#75634d" stroke-width="2" d="M10 20 Q60 3 110 20L100 165C99 181 22 181 20 165Z"/>
<g clip-path="url(#inside)">
<g class="dairy"><path fill="url(#cream)" d="M9 80Q33 74 60 80T111 78V180H9Z"/><ellipse cx="60" cy="80" rx="49" ry="8" fill="#faf2d9"/></g>
<g class="green"><path fill="url(#tea)" d="M10 38Q58 25 110 38V89Q97 80 86 104T69 101Q64 84 56 99T37 113Q32 95 13 97Z"/><ellipse cx="60" cy="39" rx="49" ry="8" fill="#b2bc64"/></g>
<g class="cubes"><g class="cube"><use href="#cube" transform="translate(30 119) rotate(-14)"/><use href="#cube" transform="translate(55 139) rotate(9)"/></g><g class="cube second"><use href="#cube" transform="translate(68 110) rotate(15)"/><use href="#cube" transform="translate(48 93) rotate(-11)"/></g></g></g>
<path class="stream" d="M80 -2Q72 23 66 77" fill="none" stroke="#fff5dc" stroke-width="5" stroke-linecap="round"/>
<ellipse cx="60" cy="20" rx="50" ry="10" fill="url(#wall)" stroke="#786e56" stroke-width="1.8"/>
<path fill="none" stroke="#fffce7" stroke-linecap="round" d="M14 18Q31 7 69 11M17 34l7 92m2 11 1 14M102 39l-4 55M26 166q30 12 65 1" stroke-width="2.8"/>
<path fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="3" d="M28 28c6 40 4 80 8 120"/>
<ellipse cx="60" cy="176" rx="42" ry="6" fill="#5c4a36" opacity=".18"/>
</g></svg>
