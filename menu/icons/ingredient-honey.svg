  <!-- Jar handle -->
  <path d="M 52 35 Q 62 35 62 50" fill="none" stroke="#c9b5a0" stroke-width="2" stroke-linecap="round"/>
  <!-- Honey inside -->
  <ellipse cx="40" cy="50" rx="13" ry="10" fill="#d4a574" opacity="0.8"/>
