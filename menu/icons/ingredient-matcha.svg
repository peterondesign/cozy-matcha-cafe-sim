<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Bowl shadow -->
  <ellipse cx="40" cy="65" rx="28" ry="6" fill="#6f853a" opacity="0.2"/>
  <!-- Bowl -->
  <path d="M 20 35 Q 20 50 40 60 Q 60 50 60 35 Z" fill="#d4c5a0" stroke="#8b7355" stroke-width="1.5"/>
  <!-- Bowl outline -->
  <path d="M 20 35 Q 20 50 40 60 Q 60 50 60 35" fill="none" stroke="#8b7355" stroke-width="1.5"/>
  <!-- Matcha powder inside bowl -->
  <ellipse cx="40" cy="48" rx="18" ry="12" fill="#6f853a"/>
  <!-- Matcha powder texture -->
  <circle cx="30" cy="45" r="2" fill="#5a6e2f" opacity="0.6"/>
  <circle cx="50" cy="47" r="1.5" fill="#5a6e2f" opacity="0.6"/>
  <circle cx="40" cy="52" r="1.8" fill="#5a6e2f" opacity="0.6"/>
  <!-- Whisk hint -->
  <line x1="35" y1="42" x2="45" y2="54" stroke="#8b7355" stroke-width="1" opacity="0.4"/>
  <line x1="45" y1="42" x2="35" y2="54" stroke="#8b7355" stroke-width="1" opacity="0.4"/>
</svg>
