<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Little Matcha Days</title>
<link rel="icon" href="../brand/favicon-32.png" sizes="32x32">
<link rel="icon" href="../brand/favicon-64.png" sizes="64x64">
<link rel="apple-touch-icon" href="../brand/apple-touch.png">
<link rel="stylesheet" href="../shared/hud.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100dvh;
  font-family: Nunito, Georgia, sans-serif;
  color: #5a3a22;
  background: #1d2818 url("layers/bg.png") center / cover no-repeat fixed;
}
.menu {
  width: min(720px, calc(100vw - 24px));
  margin: calc(4vh + 48px) auto 3vh;
  padding: 8px 22px 16px;
  border: 42px solid transparent;
  border-image: url("layers/ui/panel.png") 160 fill;
  border-image-repeat: stretch;
  position: relative;
}
.plaque { position: relative; width: min(280px, 70%); margin: -58px auto 8px; }
.title { display: block; width: 100%; }
.title-text {
  position: absolute;
  left: 50%;
  top: 46%;
  transform: translate(-50%, -50%);
  margin: 0;
  font-size: 32px;
  letter-spacing: .02em;
  white-space: nowrap;
}
.close {
  position: absolute;
  top: -28px;
  right: -18px;
  width: 64px;
  height: 64px;
  padding: 0;
  border: 0;
  background: url("layers/ui/close.png") center / contain no-repeat;
  cursor: pointer;
}
.close:hover, .row:hover { filter: brightness(1.12); }
.close:active, .row:active { filter: brightness(0.92); transform: translateY(1px); }
.matcha { display: block; width: min(340px, 78%); margin: 0 auto 12px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.row {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 64px;
  padding: 8px 18px 8px 16px;
  border: 0;
  background: url("layers/ui/pill-cream.png") center / 100% 100% no-repeat;
  color: #5a3a22;
  font: 800 20px/1 Nunito, Georgia, sans-serif;
  cursor: pointer;
  text-align: left;
}
.row.primary { background-image: url("layers/ui/pill-green.png"); color: #fff8e4; }
.row img { width: 36px; height: 36px; object-fit: contain; flex: none; }
.row span { flex: 1; }
a.row { text-decoration: none; }
.row .mark { width: 36px; text-align: center; font-size: 28px; line-height: 1; flex: none; }
.wide { grid-column: 1 / -1; width: min(420px, 100%); justify-self: center; }
.footer {
  position: relative;
  height: 78px;
  margin: 14px 4px 0;
  background: url("layers/ui/footer.png") center / 100% 100% no-repeat;
}
.avatar {
  position: absolute;
  left: -4px;
  top: 50%;
  width: 76px;
  height: 76px;
  transform: translateY(-50%);
  object-fit: contain;
}
.slot {
  position: absolute;
  top: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-weight: 800;
  font-size: 16px;
}
.slot.who { left: 11%; width: 40%; }
.slot.level { left: 54%; width: 42%; }
.stats { display: none; }
.slot img { width: 28px; height: 28px; object-fit: contain; flex: none; }
.toast {
  position: fixed; left: 50%; bottom: 16px; transform: translate(-50%, 10px);
  opacity: 0; background: #2c331fe6; color: #fff4cf; border-radius: 999px;
  padding: 10px 16px; font: 700 13px Nunito, sans-serif; pointer-events: none; transition: .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.confirm { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #1b140c66; }
.confirm[hidden] { display: none; }
.confirm-card { width: min(88vw, 420px); padding: 26px 22px 20px; border-radius: 28px; background: #f7f1e2; color: #4a3424; text-align: center; font-family: Georgia, serif; }
.confirm-card h2 { margin: 0 0 8px; font-size: 34px; font-weight: 500; }
.confirm-card p { margin: 0 0 16px; font: 600 16px/1.4 system-ui, sans-serif; }
.confirm-card .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.confirm-card button { min-height: 52px; border: 0; border-radius: 14px; background: #7d9a45; color: #fffaf0; font: 700 16px/1.2 system-ui, sans-serif; cursor: pointer; }
.confirm-card #confirmNo { background: #8d6a45; }
.settings { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 14px; margin-top: 8px; }
.settings .panel { min-width: 0; }
  #shelf { grid-template-columns: 1fr; }
  #shelf p { margin: 8px 0 16px; font: 800 18px/1.4 Nunito, sans-serif; }
  #shelfBody { max-height: 48vh; overflow: auto; padding-right: 4px; }
  .stock-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stock-card {
    display: grid; grid-template-columns: 42px 1fr; gap: 8px; align-items: center;
    padding: 6px; border-radius: 14px; background: #fff8eacc;
  }
  .stock-card img { width: 42px; height: 42px; object-fit: contain; }
  .stock-card b { display: block; font: 800 13px/1.2 system-ui, sans-serif; }
  .stock-card small { color: #7d684c; font: 700 12px/1.2 system-ui, sans-serif; }
  .meter { height: 12px; margin-top: 4px; border-radius: 99px; background: #efe6d4; overflow: hidden; box-shadow: inset 0 1px 2px #00000018; }
  .meter span { display: block; height: 100%; background: linear-gradient(#c5e07a, #6f853a); }
  .meter.low span { background: linear-gradient(#f0a3a0, #d4544a); }
  .restock { display: block; width: min(168px, 46%); margin: 8px auto 0; border: 0; background: transparent; cursor: pointer; }
.restock[hidden] { display: none !important; }
  .restock img { width: 100%; height: auto; display: block; }
[hidden] { display: none !important; }
.cats { display: flex; flex-direction: column; gap: 10px; }
.audio-block { margin: 0 0 16px; padding-bottom: 12px; border-bottom: 1px solid #e4d3b4; }
.audio-block h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 22px; }
.audio-block h2 img { width: 28px; height: 28px; object-fit: contain; }
.mute-row, .volume { display: flex; align-items: center; gap: 8px; }
.mute-row { justify-content: flex-end; margin-bottom: 8px; }
.mute {
  min-width: 46px;
  min-height: 36px;
  border: 0;
  border-radius: 999px;
  background: #f4ead4;
  color: #8a6a45;
  font: 800 16px/1 Nunito, sans-serif;
  cursor: pointer;
}
.mute.on { background: #7d9a45; color: #fff8e4; }
input[type="range"] {
  flex: 1;
  height: 12px;
  border-radius: 99px;
  appearance: none;
  background: linear-gradient(#7d9a45, #7d9a45) 0 / var(--fill, 70%) 100% no-repeat, #eadcc2;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  appearance: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 3px solid #6f853a;
  background: #f7f1e2;
}
.account label { display: block; font-weight: 800; margin-bottom: 8px; }
.account input {
  width: 100%;
  min-height: 52px;
  border: 2px solid #c4a56e;
  border-radius: 16px;
  background: #fff8ea;
  color: #5a3a22;
  font: 800 18px/1 Nunito, sans-serif;
  padding: 0 14px;
}
.panel[hidden] { display: none; }
.avatar-scroll {
  position: relative;
  border-radius: 18px;
}
.avatar-scroll::before, .avatar-scroll::after {
  content: ""; position: absolute; z-index: 1; top: 0; bottom: 0; width: 18px; pointer-events: none;
}
.avatar-scroll::before { left: 0; background: linear-gradient(90deg, #a9916c70, transparent); }
.avatar-scroll::after { right: 0; background: linear-gradient(270deg, #a9916c70, transparent); }
.avatar-grid {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scroll-snap-type: x proximity;
  padding: 8px;
  scrollbar-width: thin;
}
.avatar-choice {
  flex: 0 0 100px;
  scroll-snap-align: start;
  border: 3px solid transparent;
  border-radius: 18px;
  background: #fff8eacc;
  cursor: pointer;
  padding: 6px;
}
.avatar-choice img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.avatar, .avatar-choice img, #accountAvatar {
  border-radius: 50%;
  object-position: center 18%;
  background: #e6d7b7;
}
#accountAvatar { width: 38px; height: 38px; object-fit: cover; flex: none; border: 2px solid #b99e70; }
#accountCategory { display: flex; align-items: center; }
#accountCategory span { flex: 1; }
.avatar-choice.selected { border-color: #78994b; background: #edf3d9; }
.account-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.account-actions button, .sync-import {
  min-height: 48px;
  border: 0;
  border-radius: 14px;
  background: #7d9a45;
  color: #fffaf0;
  font: 800 14px Nunito, sans-serif;
  cursor: pointer;
  text-align: center;
}
.account-actions button.secondary { background: #9a7a50; }
.account-status { margin: 10px 0 0; min-height: 20px; color: #74604a; font: 700 13px/1.3 Nunito, sans-serif; }
.upgrade-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.upgrade-card {
  position: relative;
  min-height: 190px;
  border: 2px solid #d4ba86;
  border-radius: 20px;
  background: #fff8eacc;
  overflow: hidden;
  padding: 8px;
  color: #553b27;
  text-align: left;
  cursor: pointer;
  font-family: Nunito, sans-serif;
}
.upgrade-card.locked { filter: saturate(.55); }
.upgrade-card.selected { border: 3px solid #78994b; box-shadow: 0 0 0 3px #dce9b3 inset; }
.upgrade-preview { display: block; position: relative; height: 118px; overflow: hidden; }
.upgrade-preview img { position: absolute; left: 50%; bottom: 8px; width: 125%; max-width: none; height: auto; transform: translateX(-50%); }
.upgrade-preview[data-size="medium"] img { width: 165%; }
.upgrade-preview[data-size="small"] img { width: 225%; }
.upgrade-card .upgrade-name { display: block; font-size: 15px; font-weight: 800; }
.upgrade-card .upgrade-meta { display: block; margin-top: 3px; font-size: 12px; font-weight: 800; color: #7d684c; }
.upgrade-card .state { position: absolute; right: 8px; top: 8px; border-radius: 999px; background: #7d684c; color: #fff8e7; padding: 4px 8px; font-size: 11px; }
.upgrade-card.selected .state { background: #78994b; }
.upgrade-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.upgrade-tabs button { min-height: 44px; border: 0; border-radius: 14px; background: #eadcc2; color: #64482f; font: 800 14px Nunito, sans-serif; }
.upgrade-tabs button.active { background: #78994b; color: #fff8e7; }
.gem-note { display: block; margin: 8px 0 12px; text-align: center; color: #7d684c; font: 800 14px Nunito, sans-serif; }
#shelfBack { width: fit-content; min-width: 120px; min-height: 44px; margin: 12px 0 0; align-self: start; padding: 8px 18px; }
.building-preview {
  height: 118px;
  width: 100%;
  border-radius: 14px;
  display: grid;
  place-items: end center;
  background: linear-gradient(160deg, #dfeac7 0 58%, #cbdca5 58%);
  overflow: hidden;
  position: relative;
}
.building-preview::before {
  content: "";
  width: 58%;
  height: 58%;
  margin-bottom: 14px;
  border: 7px solid #715238;
  border-radius: 8px 8px 3px 3px;
  background:
    linear-gradient(135deg, transparent 48%, #b77f4d 49 54%, transparent 55%) 0 0/18px 18px,
    linear-gradient(#fff5d6, #d9b58b);
  box-shadow: 0 7px 0 #8d6a45;
}
.building-preview.tier-2::before { width: 72%; border-top-width: 12px; border-radius: 20px 20px 4px 4px; }
.building-preview.tier-3::before { width: 82%; height: 68%; border-top-width: 16px; border-radius: 24px 24px 4px 4px; }
.building-preview.tier-4::before { width: 88%; height: 76%; border-width: 9px 16px 14px; border-radius: 28px 28px 5px 5px; }
.building-preview::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 42%;
  width: 84%;
  height: 12px;
  transform: translateX(-50%) skewY(-10deg);
  background: #78994b;
  border: 3px solid #5d7440;
  border-radius: 8px;
  box-shadow: 0 -14px 0 #aebd73;
}
.leaderboard-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.leaderboard-tabs button {
  padding: 8px 16px;
  border: 2px solid #d4ba86;
  border-radius: 999px;
  background: #fff8eacc;
  color: #5a3a22;
  font: 800 14px/1 Nunito, sans-serif;
  cursor: pointer;
  transition: all .2s ease;
}
.leaderboard-tabs button.active {
  background: #7d9a45;
  color: #fff8e4;
  border-color: #6f853a;
}
.leaderboard-table {
  width: 100%;
  border-collapse: collapse;
  background: #fff8eacc;
  border: 2px solid #d4ba86;
  border-radius: 12px;
  overflow: hidden;
}
.leaderboard-table th {
  padding: 10px 8px;
  background: #f4ead4;
  font: 800 12px/1 Nunito, sans-serif;
  color: #5a3a22;
  text-align: left;
  border-bottom: 2px solid #d4ba86;
}
.leaderboard-table td {
  padding: 10px 8px;
  border-bottom: 1px solid #e6d3ae;
  font: 600 13px/1.2 system-ui, sans-serif;
  color: #5a3a22;
}
.leaderboard-table tr:last-child td { border-bottom: none; }
.leaderboard-table tr.you {
  background: #edf3d9;
  font-weight: 800;
}
.leaderboard-table tr.you td { color: #6f853a; }
.leaderboard-table td:first-child { text-align: center; width: 40px; }
.leaderboard-player { display: flex; align-items: center; gap: 6px; }
.leaderboard-player img { width: 34px; height: 34px; border-radius: 50%; flex: none; }
.leaderboard-note { font-size: 12px; color: #806b4e; }
#game-loading { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #273323eF; padding: 20px; }
#game-loading[hidden] { display: none; }
.game-loading-card { width: min(390px, 100%); padding: 25px; text-align: center; border: 3px double #a17d4b; border-radius: 20px; background: #fff6e8; }
.game-loading-card h2 { margin: 0 0 12px; }
.game-loading-card progress { width: 100%; accent-color: #789459; }
.game-loading-card button { padding: 10px 20px; border: 0; border-radius: 20px; background: #789459; color: white; font: inherit; cursor: pointer; }
@media (max-width: 680px) {
  .leaderboard-tabs { gap: 6px; }
  .leaderboard-tabs button { padding: 6px 12px; font-size: 12px; }
  .leaderboard-table { font-size: 12px; }
  .leaderboard-table th { padding: 8px 6px; font-size: 11px; }
  .leaderboard-table td { padding: 8px 6px; font-size: 11px; }
}
@media (max-width: 680px) {
  .settings { grid-template-columns: minmax(0, 1fr); }
  .menu { border-width: 22px; padding: 36px 12px 14px; margin: 76px auto 16px; }
  .plaque { width: min(230px, 64%); margin: 8px auto 10px; }
  .title-text { font-size: 26px; }
  .grid { grid-template-columns: 1fr; }
  .wide { width: 100%; }
  .row {
    min-height: 58px;
    font-size: 18px;
    border-style: solid;
    border-width: 0 29px;
    border-image: url("layers/ui/pill-cream-round.png") 0 163 fill;
    background: none;
  }
  .row.primary {
    border-image-source: url("layers/ui/pill-green.png");
    border-image-slice: 0 293 fill;
  }
  .footer {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 0;
    margin: 14px 2px 0;
    padding: 6px 12px 6px 6px;
    background: #f4ead4;
    border: 2px solid #c4a56e;
    border-radius: 999px;
  }
  .avatar {
    position: static;
    transform: none;
    width: 34px;
    height: 34px;
  }
  .slot.who, .slot.level { position: static; display: block; transform: none; font-size: 13px; white-space: nowrap; }
  .close { width: 46px; height: 46px; top: 18px; right: 6px; }
}
</style>
</head>
<body>
<matcha-hud></matcha-hud>
<main class="menu">
  <div class="plaque">
    <img class="title" src="layers/ui/title.png" alt="">
    <h1 class="title-text">Pause</h1>
  </div>
  <button class="close" type="button" data-action="close" aria-label="Close menu"></button>
  <img class="matcha" id="matcha" src="layers/ui/matcha.png" alt="">
  <nav class="grid" id="mainMenu" aria-label="Game menu">
    <button class="row primary" type="button" data-action="resume"><img src="layers/ui/icon-play.png" alt=""><span>Resume Game</span></button>
    <button class="row" type="button" data-action="inventory"><img src="layers/ui/icon-bag.png" alt=""><span>Inventory</span></button>
    <button class="row" type="button" data-action="upgrades"><img src="layers/ui/icon-hammer.png" alt=""><span>Building</span></button>
    <button class="row" type="button" data-action="recipes"><img src="layers/ui/icon-book.png" alt=""><span>Recipes</span></button>
    <button class="row" type="button" data-action="leaderboard"><img src="layers/ui/icon-trophy.png" alt=""><span>Leaderboard</span></button>
    <button class="row" type="button" data-action="settings"><img src="layers/ui/icon-gear.png" alt=""><span>Settings</span></button>
    <button class="row wide" type="button" data-action="new"><img src="layers/ui/icon-game.png" alt=""><span>New Game</span></button>
    <a class="row wide" href="https://tally.so/r/810XRA" target="_blank" rel="noopener noreferrer"><span class="mark" aria-hidden="true">✉</span><span>Contact us</span></a>
  </nav>
  <section class="settings" id="shelf" hidden>
    <p id="shelfText"></p>
    <div id="shelfBody"></div>
    <button class="row primary" type="button" id="shelfBack">Back</button>
  </section>
  <section class="settings" id="settings" hidden>
    <div class="cats">
      <button class="row primary" type="button" data-cat="audio"><img src="layers/ui/icon-gear.png" alt=""><span>Audio</span></button>
      <button class="row" id="accountCategory" type="button" data-cat="account"><img id="accountAvatar" src="layers/avatars/avatar-1.png" alt=""><span>Account</span></button>
      <button class="row" type="button" id="settingsBack"><span>Back</span></button>
    </div>
    <div>
      <div class="panel" id="audioPanel">
        <div class="audio-block">
          <h2><img src="layers/ui/icon-gear.png" alt="">Music</h2>
          <div class="mute-row">
            <button class="mute" type="button" id="musicOff" aria-label="Mute music">Mute</button>
            <button class="mute on" type="button" id="musicOn" aria-label="Play music">On</button>
          </div>
          <div class="volume"><span aria-hidden="true">-</span><input id="musicVolume" type="range" min="0" max="100" value="70"><span aria-hidden="true">+</span></div>
        </div>
        <div class="audio-block">
          <h2><img src="layers/ui/icon-coin.png" alt="">Sound Effects</h2>
          <div class="mute-row">
            <button class="mute" type="button" id="effectsOff" aria-label="Mute sound effects">Mute</button>
            <button class="mute on" type="button" id="effectsOn" aria-label="Play sound effects">On</button>
          </div>
          <div class="volume"><span aria-hidden="true">-</span><input id="effectsVolume" type="range" min="0" max="100" value="80"><span aria-hidden="true">+</span></div>
        </div>
      </div>
      <div class="panel account" id="accountPanel" hidden>
        <label for="playerNameInput">Name on the counter</label>
        <input id="playerNameInput" maxlength="18" autocomplete="nickname">
        <h2>Avatar</h2>
        <div class="avatar-scroll"><div class="avatar-grid" id="avatarGrid" aria-label="Choose avatar"></div></div>
        <h2>Account sync</h2>
        <div class="account-actions">
          <button type="button" id="syncExport">Export progress</button>
          <button type="button" class="secondary" id="syncImport">Import progress</button>
        </div>
        <input id="syncCode" type="text" aria-label="Progress sync code" placeholder="Paste sync code here" hidden>
        <p class="account-status" id="accountStatus" role="status"></p>
      </div>
    </div>
  </section>
  <footer class="footer" aria-label="Player">
    <img class="avatar" src="layers/ui/player.png" alt="">
    <div class="slot who"><span id="playerName"></span></div>
    <div class="slot level"><img src="layers/ui/icon-level.png" alt=""><span id="levelValue"></span></div>
  </footer>
</main>
<div class="toast" id="toast" role="status"></div>
<section id="game-loading" aria-label="Preparing game" hidden>
  <div class="game-loading-card">
    <h2>Preparing Little Matcha Days</h2>
    <p id="game-loading-label" role="status">Preparing game assets…</p>
    <progress id="game-loading-progress" max="100" value="0" aria-label="Game loading progress"></progress>
    <p><button id="game-loading-continue" type="button">Continue without waiting</button></p>
  </div>
</section>
<div class="confirm" id="confirm" hidden>
  <div class="confirm-card">
    <h2>New game?</h2>
    <p>This clears the day, the coins, and the queue.</p>
    <div class="row">
      <button type="button" id="confirmNo">Keep playing</button>
      <button type="button" id="confirmYes">Start new game</button>
    </div>
  </div>
</div>
<script src="../shared/audio-bus.js?v=2"></script>
<script src="../shared/pantry.js"></script>
<script src="../shared/shop.js"></script>
<script src="../shared/world-hud.js?v=3"></script>
<script src="menu.js?v=22"></script>
</body>
</html>
