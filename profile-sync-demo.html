<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Sync Demo</title>
  <link rel="stylesheet" href="shared/profile-connector.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    
    .demo-container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    
    h1 {
      margin-top: 0;
      color: #2c2c2c;
      font-size: 32px;
    }
    
    .description {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    
    .cta-button {
      background: linear-gradient(135deg, #76c7a0 0%, #5fb88a 100%);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(118, 199, 160, 0.3);
    }
    
    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(118, 199, 160, 0.4);
    }
    
    .info-box {
      background: #f5f5f5;
      border-left: 4px solid #76c7a0;
      padding: 16px;
      margin-top: 20px;
      text-align: left;
      border-radius: 8px;
    }
    
    .info-box h3 {
      margin-top: 0;
      color: #333;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .info-box p {
      margin: 8px 0;
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <h1>🎮 Profile Sync</h1>
    <p class="description">
      Connect your profile across all devices. It's as simple as copying a code!
    </p>
    
    <button class="cta-button" onclick="window.ProfileConnector?.show?.()">
      Open Profile Sync
    </button>
    
    <div class="info-box">
      <h3>✨ How it works</h3>
      <p>• Copy your unique profile code</p>
      <p>• Paste it on any device to sync</p>
      <p>• Your progress follows you everywhere</p>
      <p>• Share your code with friends</p>
    </div>
  </div>

  <!-- Load the profile connector -->
  <script src="shared/profile-connector.js"></script>
  
  <script>
    // Mock MatchaLeaderboard for demo
    if (!window.MatchaLeaderboard) {
      window.MatchaLeaderboard = {
        enabled: () => true,
        playerId: () => 'matcha-player-' + Math.random().toString(36).substr(2, 9),
        pull: async (code) => {
          // Simulate loading a profile
          return {
            display_name: 'Demo Player',
            avatar: '🎮',
            state: { coins: 500, gems: 50, day: 5 }
          };
        },
        setPlayerId: (code) => console.log('Profile synced:', code)
      };
    }
  </script>
</body>
</html>
