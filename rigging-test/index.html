<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rigging Test</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#263329;overflow:hidden;font:600 16px Georgia,serif}
#stage{position:fixed;inset:0;overflow:hidden}
#walk-right{position:absolute;width:min(45vw,448px);height:auto;left:50%;top:50%;transform:translate(-50%,-50%);user-select:none;pointer-events:none}
#controls{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));z-index:2;display:flex;gap:8px;transform:translateX(-50%)}
#controls button{min-width:44px;height:44px;border:3px double #9e7b48;border-radius:13px;background:#fff0cf;color:#49351f;font:700 18px Georgia;cursor:pointer;touch-action:none}
</style>
<main id="stage" aria-label="Walk right GIF test">
  <img id="walk-right" src="walk_right.gif" alt="Character walking right">
</main>
<div id="controls" aria-label="Walk test controls">
  <button id="left" type="button" aria-label="Move left">◀</button>
  <button id="reset" type="button" aria-label="Reset position">↺</button>
  <button id="right" type="button" aria-label="Move right">▶</button>
</div>
<script type="module" src="rig.js"></script>
</html>
