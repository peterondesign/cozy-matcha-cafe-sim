<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Little Matcha Days</title>
<style>
  :root { color-scheme: light; --ink: #4b321f; --cream: #fff6e4; --sage: #6f853a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1b2616; }
  body { height: 100dvh; overflow: hidden; font-family: Georgia, "Times New Roman", serif; color: var(--ink); }
  .stage {
    position: relative;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
    cursor: pointer;
  }
  .scene { position: absolute; }
  .plate, canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .plate { object-fit: fill; }
  .order-card {
    position: absolute;
    z-index: 2;
    left: 50%;
    top: 16%;
    width: min(78vw, 440px);
    transform: translateX(-50%);
    pointer-events: none;
  }
  .order-card img { display: block; width: 100%; height: auto; }
  .hud, .steps, .serve, .pause {
    position: absolute;
    z-index: 2;
    border: 0;
    font-family: Georgia, serif;
  }
  .hud {
    left: 2.2%;
    top: 3%;
    max-width: 34%;
    padding: 8px 12px;
    border-radius: 14px;
    background: #fff6e4e6;
    box-shadow: 0 8px 18px #2a1c1130;
  }
  .hud small { display: block; font: 700 10px/1.2 system-ui, sans-serif; letter-spacing: .14em; color: #7d684c; }
  .hud strong { display: block; margin-top: 2px; font-size: clamp(16px, 2vw, 26px); }
  .hud em { display: block; margin-top: 2px; font-style: normal; font: 600 13px/1.3 system-ui, sans-serif; color: #6d573c; }
  .steps {
    left: 2.2%;
    bottom: 3%;
    display: flex;
    gap: 6px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .steps li {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff6e4aa;
    box-shadow: inset 0 0 0 2px #8d6844;
  }
  .steps li.on { background: var(--sage); }
  .steps li.now { outline: 2px solid #fff6e4; outline-offset: 2px; }
  .serve, .pause {
    cursor: pointer;
    border-radius: 999px;
    background: #6f853a;
    color: #fff8e4;
    font-weight: 700;
    box-shadow: 0 4px 0 #425525;
  }
  .serve { right: 3%; bottom: 4%; padding: 12px 22px; font-size: 20px; }
  .serve[hidden] { display: none; }
  .pause {
    right: 2.2%;
    top: 3%;
    padding: 8px 14px;
    background: #3f472ce6;
    box-shadow: none;
    font: 700 13px system-ui, sans-serif;
    text-decoration: none;
  }
  .serve:active { transform: translateY(3px); box-shadow: 0 1px 0 #425525; }
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="scene" id="scene">
    <img class="plate" id="plate" alt="" src="../09-ice/clean_plate_POV.png">
    <canvas id="prep"></canvas>
  </div>
  <div class="order-card"><img src="../09-ice/order.png" alt=""></div>
  <div class="hud">
    <small id="kicker">Order</small>
    <strong id="orderName">Matcha</strong>
    <em id="stepLabel">Pour matcha powder</em>
  </div>
  <a class="pause" href="index.html">Pause</a>
  <ol class="steps" id="steps"></ol>
  <button class="serve" id="serve" type="button" hidden>Serve</button>
</main>
<script>
const ACTIONS = {
  'pour-powder': { label: 'Pour matcha powder', slot: 'bowl', frames: [1, 2, 3, 4, 5, 6, 7, 8] },
  'whisk': { label: 'Whisk the matcha', slot: 'bowl', frames: [9, 10, 11, 12, 13, 14, 15, 16] }
};
const ORDERS = [
  { name: 'Matcha', steps: ['pour-powder', 'whisk'] }
];
const ANCHORS = {
  bowl: { x: 0.38, y: 0.47, s: 0.26 }
};

const stage = document.getElementById('stage');
const scene = document.getElementById('scene');
const canvas = document.getElementById('prep');
const ctx = canvas.getContext('2d');
const orderName = document.getElementById('orderName');
const stepLabel = document.getElementById('stepLabel');
const stepsEl = document.getElementById('steps');
const serve = document.getElementById('serve');
const cache = new Map();
let orderIndex = 0;
let stepIndex = 0;
let phase = 'ready';
let served = 0;
let coins = Number(JSON.parse(localStorage.getItem('matchaVisualState') || '{}').coins || 125);
const held = { glass: null, bowl: null };

function frameSrc(_action, n) {
  return `../09-ice/pour/frame_${String(n).padStart(2, '0')}.png`;
}
function loadImage(src) {
  if (cache.has(src)) return cache.get(src);
  const pending = new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(src));
    img.src = src;
  });
  cache.set(src, pending);
  return pending;
}
function order() { return ORDERS[orderIndex % ORDERS.length]; }
function paintSteps() {
  const count = order().steps.length;
  stepsEl.innerHTML = order().steps.map((_, i) => `<li class="${i < stepIndex ? 'on' : ''} ${i === stepIndex && phase !== 'served' ? 'now' : ''}"></li>`).join('');
  if (stepsEl.children.length !== count) return;
}
function layout() {
  const width = stage.clientWidth;
  const height = stage.clientHeight;
  const scale = Math.max(width / 2048, height / 1152);
  const sceneWidth = 2048 * scale;
  const sceneHeight = 1152 * scale;
  scene.style.left = ((width - sceneWidth) / 2) + 'px';
  scene.style.top = ((height - sceneHeight) / 2) + 'px';
  scene.style.width = sceneWidth + 'px';
  scene.style.height = sceneHeight + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(sceneWidth * dpr));
  canvas.height = Math.max(1, Math.round(sceneHeight * dpr));
  draw();
}
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const img = held.bowl;
  if (!img) return;
  const a = ANCHORS.bowl;
  const width = a.s * canvas.width;
  const height = width * (img.height / img.width);
  ctx.drawImage(img, a.x * canvas.width, a.y * canvas.height, width, height);
}
function render() {
  const current = order();
  orderName.textContent = current.name;
  if (phase === 'ready') stepLabel.textContent = ACTIONS[current.steps[stepIndex]].label;
  if (phase === 'done') stepLabel.textContent = 'Matcha is whisked';
  if (phase === 'playing') stepLabel.textContent = ACTIONS[current.steps[stepIndex]].label;
  serve.hidden = true;
  paintSteps();
  window.__game = {
    recipe: current.name,
    step: phase === 'done' ? current.steps.length : stepIndex,
    phase,
    served,
    coins,
    orders: ORDERS.map(item => item.name)
  };
}
async function playStep() {
  if (phase === 'playing' || phase === 'done') return;
  const id = order().steps[stepIndex];
  const spec = ACTIONS[id];
  phase = 'playing';
  render();
  for (const n of spec.frames) {
    held[spec.slot] = await loadImage(frameSrc(id, n));
    draw();
    await new Promise(resolve => setTimeout(resolve, 170));
  }
  stepIndex += 1;
  phase = stepIndex >= order().steps.length ? 'done' : 'ready';
  render();
}
function serveOrder() {
  if (phase !== 'done') return;
  served += 1;
  coins += 18;
  const saved = JSON.parse(localStorage.getItem('matchaVisualState') || '{}');
  saved.coins = coins;
  localStorage.setItem('matchaVisualState', JSON.stringify(saved));
  orderIndex += 1;
  stepIndex = 0;
  phase = 'ready';
  held.glass = null;
  held.bowl = null;
  draw();
  render();
}
stage.addEventListener('click', event => {
  if (event.target.closest('.pause, .serve')) return;
  playStep();
});
serve.addEventListener('click', event => { event.stopPropagation(); serveOrder(); });
window.addEventListener('keydown', event => {
  if (event.code === 'Space' || event.code === 'Enter') {
    event.preventDefault();
    if (phase === 'done') serveOrder();
    else playStep();
  }
});
window.addEventListener('resize', layout);
layout();
render();
ORDERS.flatMap(item => item.steps).forEach(id => ACTIONS[id].frames.forEach(n => loadImage(frameSrc(id, n)).catch(() => {})));
</script>
</body>
</html>
