<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iced Matcha Latte · Drink Recipe</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:clamp(8px,2vw,26px);font:18px Georgia,serif;color:#492b15;background:#8b794f url(art/counter.webp) center/cover fixed}
main{max-width:810px;margin:auto;border:6px double #b58b56;border-radius:32px;background:linear-gradient(120deg,#fff2d6,#f7e4bf 52%,#fff3dc);box-shadow:0 8px 26px #48260d60;padding:clamp(12px,2vw,24px)}
header,.status,.preview,nav{display:flex;align-items:center;gap:16px}header{position:relative;padding-right:65px}header img{width:19%;border-radius:50%;mix-blend-mode:multiply}h1{font-size:clamp(25px,4vw,46px);line-height:1;margin:0 0 12px}h2,p{margin:6px 0}small{color:#fff5d1;background:#687134;padding:7px 10px;border-radius:12px}header aside{position:absolute;right:0;top:-18px;padding:18px 7px;color:ivory;background:#666734;text-align:center;border:3px double #c9ac70;border-radius:0 0 12px 12px}
progress{width:100%;height:15px;accent-color:#718838}ol,article,blockquote,.quality,button{border:2px solid #c9a87a;background:#fff1d588;border-radius:18px}ol{display:flex;padding:12px 4px;list-style:none;justify-content:space-around;text-align:center}li{flex:1;font-weight:bold}li img{display:block;margin:auto;width:min(9vw,53px);border-radius:50%;mix-blend-mode:multiply}li[aria-current]{color:#506020;text-decoration:underline}blockquote,.quality{margin:0;padding:12px;flex:1}.quality strong{display:block}article{margin:16px 0;padding:12px}.stage{display:flex;align-items:flex-end;justify-content:center;width:46%;flex-shrink:0;aspect-ratio:3/2;background:url(art/counter.webp) center/cover;border-radius:12px;overflow:hidden}.stage img{width:100%;height:100%;object-fit:contain}.stage.pair img{width:50%}.stage img[hidden]{display:none}
nav{gap:8px;align-items:stretch}button{font:bold 1em Georgia;color:inherit;cursor:pointer;box-shadow:0 3px #b29766;padding:8px;flex:1}button img{display:block;margin:auto;width:min(100%,75px);mix-blend-mode:multiply;border-radius:14px}button:hover{background:#fff8e5}button:active{transform:translateY(2px)}button:focus-visible{outline:3px solid #445a21}button[aria-pressed=true]{border-color:#738129;box-shadow:inset 0 0 10px #d3bf49,0 3px #768139}#advance{display:block;margin:15px 0 0 auto;color:ivory;background:#617331;padding:10px 24px}
@media(max-width:540px){body{font-size:16px}.status,.preview{flex-direction:column;align-items:stretch;gap:8px}.stage{width:100%}nav{display:grid;grid-template-columns:repeat(2,1fr)}nav button img{width:44px}header{padding-right:0}header aside{display:none}li{font-size:14px}#advance{width:100%}}
</style>
<main><header><img src="art/icon-3.webp" alt=""><div><h1>Iced Matcha Latte</h1><b>Recipe Progress <span id="progressText"></span></b><progress id="progress" max="4"></progress></div><aside>Drink<br>Recipe</aside></header>
<ol aria-label="Recipe sequence"></ol><div class="status"><blockquote><strong>Order Note</strong><p>“An iced matcha latte, please! Lightly sweet, extra refreshing!”</p></blockquote><div class="quality"><strong>Order Quality <span id="score"></span></strong><progress id="quality" max="100" aria-label="Order quality"></progress></div></div>
<article class="preview"><div class="stage"><img id="bowl" src="art/rest-whisk.png" alt="Whisked matcha bowl" hidden><img id="action" alt=""></div><div aria-live="polite"><small id="step"></small><h2 id="title"></h2><p id="hint"></p></div></article><nav aria-label="Choose recipe step"></nav><button id="advance"></button></main>
<script>
const steps=[
 ['Whisk','Whisk the matcha until smooth and lightly foamy.','process-0.png'],
 ['Add Ice','Set the glass beside the bowl, then fill the glass with ice.','drop_ice.gif'],
 ['Add Milk','Pour milk gently over the ice, leaving room for matcha.','process-2.png'],
 ['Finish','Pour the whisked matcha over the milk to finish the layers.','pour_matcha.gif']
];
const el=id=>document.getElementById(id),buttons=document.querySelector('nav'),track=document.querySelector('ol');
let current=0,timer,complete=new Set();
steps.forEach(([name],i)=>{
 const button=document.createElement('button');
 button.innerHTML='<img alt="" src="art/icon-'+i+'.webp">'+name;
 button.onclick=()=>show(i);buttons.append(button);
 const item=document.createElement('li');item.innerHTML=button.innerHTML;track.append(item);
});
function show(i){
 clearTimeout(timer);current=i;
 const [name,hint,asset]=steps[i],pair=i===1,done=complete.size===4;
 el('step').textContent='Step '+(i+1);el('title').textContent=name;el('hint').textContent=hint;
 el('progressText').textContent=(i+1)+' / 4';el('progress').value=i+1;
 el('quality').value=complete.size*25;el('score').textContent=el('quality').value+' / 100';
 el('bowl').hidden=!pair;el('bowl').parentElement.classList.toggle('pair',pair);
 el('action').src='art/'+(pair?'rest-ice.png':asset);el('action').alt=name;
 if(pair)timer=setTimeout(()=>{el('bowl').hidden=true;el('bowl').parentElement.classList.remove('pair');el('action').src='art/'+asset},3000);
 [...buttons.children].forEach((b,n)=>{b.setAttribute('aria-pressed',n===i);track.children[n].toggleAttribute('aria-current',n===i)});
 el('advance').textContent=done?'Make another latte':i===3?'Finish drink':'Complete '+name;
}
el('advance').onclick=()=>{
 if(complete.size===4){complete.clear();show(0);return}
 complete.add(current);
 const next=steps.findIndex((_,i)=>!complete.has(i));
 show(next<0?3:next);
 if(next<0){el('title').textContent='Latte ready';el('hint').textContent='All four recipe steps complete.'}
};
show(0);
</script></html>
